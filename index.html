<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Notion Clock & Pomodoro</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --border-color: #333333;
            --btn-hover: #222222;
            --active-bg: #ffffff;
            --active-text: #121212;
            --dot-inactive: #444444;
            --transition: 0.3s ease;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #121212;
            --border-color: #e0e0e0;
            --btn-hover: #f5f5f5;
            --active-bg: #121212;
            --active-text: #ffffff;
            --dot-inactive: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Responsive Body setup for Notion Embeds */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            transition: background-color var(--transition), color var(--transition);
            overflow: hidden;
        }

        .widget-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
        }

        /* Toggle Dark Mode with Icons */
        .theme-toggle-wrapper {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .theme-toggle-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 54px;
            height: 28px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 50px;
            position: relative;
            cursor: pointer;
            padding: 0 5px;
        }

        .theme-toggle-label svg {
            width: 14px;
            height: 14px;
            fill: var(--text-color);
            z-index: 1;
        }

        .theme-toggle-label .slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 22px;
            height: 22px;
            background-color: var(--text-color);
            border-radius: 50%;
            transition: var(--transition);
            z-index: 0;
        }

        input[type="checkbox"]#themeToggle {
            display: none;
        }

        input[type="checkbox"]#themeToggle:checked + .theme-toggle-label .slider {
            transform: translateX(26px);
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2vh;
            z-index: 10;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: clamp(4px, 1.5vw, 8px) clamp(12px, 3vw, 20px);
            border-radius: 20px;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover { background: var(--btn-hover); }
        .tab-btn.active {
            background: var(--active-bg);
            color: var(--active-text);
            border-color: var(--active-bg);
        }

        /* Views */
        .view {
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease forwards;
            width: 100%;
        }

        .view.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fluid Typography for Responsiveness */
        h1.time-display {
            font-size: clamp(4rem, 18vw, 6.5rem);
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 1vh;
        }

        .date-display {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            font-weight: 500;
            opacity: 0.9;
        }

        .pomodoro-label {
            font-size: clamp(1rem, 3.5vw, 1.3rem);
            font-weight: 600;
            margin-bottom: 0.5vh;
            text-transform: capitalize;
        }

        /* Pomodoro Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 2vh;
            margin-bottom: 1.5vh;
        }

        .control-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: clamp(40px, 10vw, 50px);
            height: clamp(30px, 8vw, 36px);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .control-btn:hover { background: var(--btn-hover); }
        .control-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .control-btn svg.stroke {
            fill: none; stroke: currentColor; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* Progress Dots */
        .dots-container {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--dot-inactive);
            transition: var(--transition);
        }

        .dot.active {
            background-color: var(--text-color);
            transform: scale(1.2);
        }
        
        .dot.completed {
            background-color: var(--text-color);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div class="theme-toggle-wrapper">
            <input type="checkbox" id="themeToggle">
            <label for="themeToggle" class="theme-toggle-label">
                <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <div class="slider"></div>
            </label>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="btnClock">Clock</button>
            <button class="tab-btn" id="btnPomodoro">Pomodoro</button>
        </div>

        <div class="view active" id="viewClock">
            <h1 class="time-display" id="clockTime">00:00</h1>
            <p class="date-display" id="clockDate">Day, 00 Mon 0000</p>
        </div>

        <div class="view" id="viewPomodoro">
            <p class="pomodoro-label" id="pomodoroLabel">Focus Time</p>
            <h1 class="time-display" id="pomodoroTime">25:00</h1>
            
            <div class="controls">
                <button class="control-btn" id="pomoReset" title="Reset">
                    <svg class="stroke" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <button class="control-btn" id="pomoPlay" title="Play/Pause">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="control-btn" id="pomoSkip" title="Skip Phase">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <div class="dots-container" id="dotsContainer">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Theme Toggle ---
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('change', () => {
            if (themeToggle.checked) {
                document.body.setAttribute('data-theme', 'light');
            } else {
                document.body.removeAttribute('data-theme');
            }
        });

        // --- Tab Switching ---
        const btnClock = document.getElementById('btnClock');
        const btnPomodoro = document.getElementById('btnPomodoro');
        const viewClock = document.getElementById('viewClock');
        const viewPomodoro = document.getElementById('viewPomodoro');

        function switchTab(activeBtn, inactiveBtn, activeView, inactiveView) {
            activeBtn.classList.add('active');
            inactiveBtn.classList.remove('active');
            activeView.classList.add('active');
            inactiveView.classList.remove('active');
        }

        btnClock.addEventListener('click', () => switchTab(btnClock, btnPomodoro, viewClock, viewPomodoro));
        btnPomodoro.addEventListener('click', () => switchTab(btnPomodoro, btnClock, viewPomodoro, viewClock));

        // --- Clock Logic ---
        const clockTime = document.getElementById('clockTime');
        const clockDate = document.getElementById('clockDate');

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            clockTime.textContent = `${hours}:${minutes}`;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            clockDate.textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // --- Pomodoro State Machine ---
        const pomoTimeDisplay = document.getElementById('pomodoroTime');
        const pomoLabel = document.getElementById('pomodoroLabel');
        const btnPlay = document.getElementById('pomoPlay');
        const btnReset = document.getElementById('pomoReset');
        const btnSkip = document.getElementById('pomoSkip');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const dots = document.querySelectorAll('.dot');

        const MODES = {
            FOCUS: { time: 25 * 60, label: 'Focus Time' },
            SHORT_BREAK: { time: 5 * 60, label: 'Short Break' },
            LONG_BREAK: { time: 30 * 60, label: 'Long Break' }
        };

        let currentMode = 'FOCUS';
        let timeLeft = MODES.FOCUS.time;
        let isRunning = false;
        let timerInterval;
        let completedFocusSessions = 0; // Tracks 0 to 4

        function updatePomodoroDisplay() {
            const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const s = String(timeLeft % 60).padStart(2, '0');
            pomoTimeDisplay.textContent = `${m}:${s}`;
        }

        function updateUI() {
            pomoLabel.textContent = MODES[currentMode].label;
            
            // Update dots
            dots.forEach((dot, index) => {
                dot.className = 'dot'; // reset classes
                if (index < completedFocusSessions) {
                    dot.classList.add('completed');
                }
                // Blink or highlight the current working dot
                if (index === completedFocusSessions && currentMode === 'FOCUS') {
                    dot.classList.add('active');
                }
            });
        }

        function switchMode(newMode) {
            currentMode = newMode;
            timeLeft = MODES[currentMode].time;
            updateUI();
            updatePomodoroDisplay();
            
            // Auto-pause when phase switches
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        function nextPhase() {
            if (currentMode === 'FOCUS') {
                completedFocusSessions++;
                if (completedFocusSessions === 4) {
                    switchMode('LONG_BREAK');
                } else {
                    switchMode('SHORT_BREAK');
                }
            } else {
                // Coming back from any break
                if (completedFocusSessions === 4) {
                    completedFocusSessions = 0; // Reset cycle after long break
                }
                switchMode('FOCUS');
            }
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            } else {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updatePomodoroDisplay();
                    if (timeLeft <= 0) nextPhase();
                }, 1000);
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            switchMode(currentMode); // Resets current phase time
        }

        btnPlay.addEventListener('click', toggleTimer);
        btnReset.addEventListener('click', resetTimer);
        btnSkip.addEventListener('click', nextPhase);

        // Init UI
        updateUI();

    </script>
</body>
</html>
